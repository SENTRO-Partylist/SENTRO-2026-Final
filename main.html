<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .main {
      position: relative;
      height: 100vh;
      background-image:
        linear-gradient(
          to bottom,
          rgb(0, 0, 0) 0%,
          rgba(0, 0, 0, 0.88) 8%,
          rgba(0, 0, 0, 0.24) 18%,
          rgba(0, 0, 0, 0.08) 28%,
          rgba(0, 0, 0, 0.08) 72%,
          rgba(0, 0, 0, 0.24) 82%,
          rgba(0, 0, 0, 0.88) 92%,
          rgb(0, 0, 0) 100%
        ),
        url("img/sentro.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .scroll-arrow {
      position: absolute;
      left: 50%;
      bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background-color: rgba(0, 0, 0, 0.35);
      transform: translateX(-50%);
      text-decoration: none;
      backdrop-filter: blur(4px);
      animation: bounce 1.8s infinite;
    }

    .scroll-arrow svg {
      width: 34px;
      height: 34px;
      fill: #f5f5f5;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      padding: 44px 28px 72px;
      margin-top: -1px;
      background: #000000;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 36px rgba(16, 24, 40, 0.14);
      color: #1f2937;
      text-decoration: none;
      transition: transform 0.24s ease, box-shadow 0.24s ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 24px 44px rgba(16, 24, 40, 0.2);
    }

    .link-card-media {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      display: block;
      background: #220d0d;
    }

    .link-card-body {
      padding: 22px 22px 20px;
    }

    .link-card h2 {
      margin: 0 0 10px;
      font-size: clamp(1.55rem, 2vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      color: #1f2937;
    }

    .link-card p {
      margin: 0 0 18px;
      color: #4b5563;
      line-height: 1.3;
      font-size: 1.05rem;
    }

    .link-card-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #1f2b3f 0%, #0f172a 100%);
      color: #ffffff;
      font-size: 1.04rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .link-card.is-locked .link-card-button {
      gap: 10px;
    }

    .link-card-button .lock {
      font-size: 1rem;
      line-height: 1;
    }

    @keyframes bounce {
      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      40% {
        transform: translateX(-50%) translateY(-10px);
      }

      60% {
        transform: translateX(-50%) translateY(-4px);
      }
    }

    @media (max-width: 900px) {
      .quick-links {
        grid-template-columns: 1fr;
        padding: 36px 14px 52px;
        gap: 18px;
      }

      .link-card-body {
        padding: 18px 16px 16px;
      }

      .link-card-button {
        width: 100%;
      }
    }
  </style>
</head>

<body id="top">
  <div id="site-banner-root"></div>
  <div class="main">
    <a class="scroll-arrow" href="#quick-links" aria-label="Scroll to navigation links">
      <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
        <path d="M440-800v487L216-537l-56 57 320 320 320-320-56-57-224 224v-487h-80Z" />
      </svg>
    </a>
  </div>
  <section class="quick-links" id="quick-links" aria-label="Site sections">
    <a class="link-card" href="party-members.html" aria-label="Credentials page link">
      <img class="link-card-media" src="img/creds.png" alt="Credentials artwork">
      <div class="link-card-body">
        <h2>Credentials</h2>
        <p>See our track record, leadership experience, and achievements.</p>
        <span class="link-card-button">View Credentials</span>
      </div>
    </a>
    <a class="link-card" href="platforms-agenda.html" aria-label="Platforms page link">
      <img class="link-card-media" src="img/platforms.png" alt="Platforms artwork">
      <div class="link-card-body">
        <h2>Platforms</h2>
        <p>Explore our goals and actionable plans for student empowerment and support.</p>
        <span class="link-card-button">View Platforms</span>
      </div>
    </a>
    <a class="link-card is-locked" href="gamification.html" aria-label="Coming soon page link">
      <img class="link-card-media" src="img/coming-soon.svg" alt="Coming soon artwork">
      <div class="link-card-body">
        <h2>Coming Soon...</h2>
        <p>Stay tuned as we prove what SENTRO is capable of in service.</p>
        <span class="link-card-button"><span class="lock" aria-hidden="true">🔒</span>Locked</span>
      </div>
    </a>
  </section>
  <script src="script.js"></script>
</body>

</html>
