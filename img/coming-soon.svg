<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SENTRO Coming Soon</title>
  <desc id="desc">A red campaign-themed card saying SENTRO coming soon.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#a21f27"/>
      <stop offset="55%" stop-color="#5d1115"/>
      <stop offset="100%" stop-color="#2b0608"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <rect width="26" height="26" fill="none"/>
      <rect width="10" height="26" fill="#9f1d24" opacity="0.92"/>
    </pattern>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGlow)"/>
  <circle cx="980" cy="90" r="250" fill="#ffffff" opacity="0.04"/>
  <circle cx="180" cy="590" r="280" fill="#ffffff" opacity="0.05"/>

  <g transform="translate(310 190)" filter="url(#drop)">
    <ellipse cx="340" cy="170" rx="310" ry="130" fill="url(#disc)"/>
    <ellipse cx="340" cy="170" rx="280" ry="108" fill="url(#stripes)" opacity="0.95"/>
    <text x="340" y="190" text-anchor="middle" fill="#f7f7f7" font-size="136" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" letter-spacing="6">SENTRO</text>
  </g>

  <g transform="translate(750 84) rotate(18)">
    <rect x="0" y="0" width="36" height="196" rx="16" fill="#b6b6b6"/>
    <rect x="84" y="0" width="36" height="196" rx="16" fill="#c4c4c4"/>
    <rect x="-10" y="45" width="140" height="20" rx="10" fill="#a5a5a5"/>
    <rect x="-10" y="95" width="140" height="20" rx="10" fill="#9a9a9a"/>
  </g>

  <text x="600" y="612" text-anchor="middle" fill="#f0f0f0" opacity="0.88" font-size="54" font-family="Arial, sans-serif" letter-spacing="10">COMING SOON</text>
</svg>
