<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTRO | Credentials</title>
  <link rel="stylesheet" href="styles.css?v=1.0">
  <style>
    :root {
      --banner-offset: 86px;
    }

    .credentials-page {
      min-height: 100vh;
      box-sizing: border-box;
      padding: calc(var(--banner-offset) + 16px) 18px 34px;
      background:
        radial-gradient(circle at top right, rgba(194, 19, 19, 0.22), transparent 42%),
        linear-gradient(180deg, #090909 0%, #101010 100%);
      color: #f5f5f5;
    }

    .members-shell {
      max-width: 1200px;
      margin: 0 auto;
    }

    .members-groups {
      display: grid;
      gap: 48px;
    }

    .member-group {
      padding: 0;
    }

    .member-group-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #ff4d4f;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 12px;
    }

    .member-card {
      margin: 0;
      width: 270px;
      min-height: 330px;
      padding: 0;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .member-card:hover,
    .member-card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(255, 77, 79, 0.55);
      outline: none;
    }

    .member-card img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center top;
    }

    .member-card figcaption {
      padding: 10px;
      background: rgba(9, 9, 9, 0.9);
      color: #f5f5f5;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .member-name {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .member-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
    }

    .member-modal.is-open {
      display: flex;
    }

    .member-modal-content {
      width: min(1120px, 100%);
      max-height: calc(100vh - 32px);
      border-radius: 14px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.34);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .member-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .member-modal-title {
      margin: 0;
      font-size: 1.05rem;
      color: #111827;
    }

    .member-modal-close {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
    }

    .member-modal-body {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      overflow: hidden;
      min-height: 0;
    }

    .member-modal-aside {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .member-modal-photo {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      object-position: center top;
      aspect-ratio: 3 / 4;
      background: #f3f4f6;
    }

    .member-modal-meta {
      text-align: center;
      display: grid;
      gap: 6px;
    }

    .member-modal-member-name {
      margin: 0;
      color: #ff4d4f;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .member-modal-member-role {
      margin: 0;
      color: #575757;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
    }

    .member-modal-main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .member-modal-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      color: #111827;
      line-height: 1.45;
    }

    .member-modal-credentials {
      margin-top: 0;
      display: grid;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .member-modal-credentials h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #111827;
    }

    .member-modal-credentials ul {
      margin: 0;
      padding-left: 18px;
      color: #1f2937;
      line-height: 1.45;
    }

    .member-modal-credentials li {
      margin: 0 0 6px;
    }

    .member-modal-list strong {
      color: #ff4d4f;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      :root {
        --banner-offset: 124px;
      }

      .credentials-page {
        padding: calc(var(--banner-offset) + 10px) 12px 24px;
      }

      .member-card img {
        height: 200px;
      }

      .member-card {
        width: 220px;
        min-height: 278px;
      }

      .member-modal-body {
        grid-template-columns: 1fr;
      }

      .member-modal-photo {
        max-width: 280px;
      }

      .member-modal-aside {
        justify-items: center;
      }
    }

    @media (max-width: 560px) {
      .member-list {
        justify-content: center;
      }

      .member-card {
        width: min(320px, 100%);
      }

      .member-card img {
        height: 240px;
      }

      .member-modal-body {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <div id="site-banner-root"></div>

  <main class="credentials-page">
    <section class="members-shell" aria-label="Party members">
      <div class="members-groups"></div>
    </section>
  </main>

  <div class="member-modal" id="member-modal" aria-hidden="true">
    <div class="member-modal-content" role="dialog" aria-modal="true" aria-labelledby="member-modal-title">
      <div class="member-modal-header">
        <h2 class="member-modal-title" id="member-modal-title">Member Credentials</h2>
        <button class="member-modal-close" type="button" id="member-modal-close" aria-label="Close credentials">x</button>
      </div>
      <div class="member-modal-body">
        <div class="member-modal-aside">
          <img class="member-modal-photo" id="member-modal-photo" alt="">
          <div class="member-modal-meta">
            <p class="member-modal-member-name" id="member-modal-name"></p>
            <p class="member-modal-member-role" id="member-modal-role"></p>
          </div>
        </div>
        <div class="member-modal-main">
          <span id="member-modal-group" hidden></span>
          <div class="member-modal-credentials" id="member-modal-credentials"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js?v=1.0"></script>
</body>

</html>
